<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Color Gather v0.03</title>

<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: #f4efe8;
    color: #2b2927;
    overflow: hidden;
    touch-action: none;
    user-select: none;
  }

  #game {
    width: 100%;
    height: 100%;
    position: relative;
    background: linear-gradient(#f6f0e8, #eee4d7);
  }

  .top {
    position: absolute;
    top: 10px;
    left: 10px;
    right: 10px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px;
    z-index: 5;
  }

  .panel {
    background: rgba(255,255,255,.94);
    border: 2px solid #2b2927;
    border-radius: 16px;
    padding: 8px 10px;
    box-shadow: 0 4px 0 rgba(43,41,39,.15);
    font-weight: 800;
  }

  #backpackPanel {
    min-height: 70px;
  }

  #bagHeader {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 6px;
  }

  #bagContents {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    min-height: 28px;
  }

  .bagChip {
    background: #fff;
    border: 2px solid #2b2927;
    border-radius: 999px;
    padding: 3px 8px;
    font-size: 13px;
    font-weight: 900;
  }

  #order {
    position: absolute;
    top: 98px;
    left: 50%;
    transform: translateX(-50%);
    width: min(92vw, 390px);
    text-align: center;
    background: #fff;
    border: 3px solid #2b2927;
    border-radius: 18px;
    padding: 10px 12px;
    font-weight: 900;
    box-shadow: 0 5px 0 rgba(43,41,39,.15);
  }

  #orderTarget {
    font-size: 28px;
    margin-top: 4px;
  }

  #field {
    position: absolute;
    inset: 176px 0 180px 0;
  }

  .source {
    position: absolute;
    width: 92px;
    height: 92px;
    border: 3px solid #2b2927;
    border-radius: 24px;
    display: grid;
    place-items: center;
    font-size: 42px;
    box-shadow: 0 6px 0 rgba(43,41,39,.15);
  }

  .source small {
    position: absolute;
    bottom: 7px;
    font-size: 11px;
    background: rgba(255,255,255,.85);
    padding: 2px 7px;
    border-radius: 99px;
  }

  #red {
    left: 8%;
    top: 10%;
    background: #ff6b6b;
  }

  #blue {
    right: 8%;
    top: 30%;
    background: #6fa8ff;
  }

  #yellow {
    left: 30%;
    bottom: 4%;
    background: #ffd95f;
  }

  .source.active {
    transform: scale(.96);
  }

  .ring {
    position: absolute;
    inset: -10px;
    border-radius: 30px;
    border: 5px solid transparent;
    pointer-events: none;
  }

  .source.active .ring {
    border-top-color: #2b2927;
    animation: spin .55s linear infinite;
  }

  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }

  #crafted {
    position: absolute;
    left: 10px;
    right: 10px;
    bottom: 112px;
    min-height: 44px;
    display: flex;
    gap: 8px;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
  }

  .craftedChip {
    background: #fff;
    border: 2px solid #2b2927;
    border-radius: 999px;
    padding: 6px 10px;
    font-weight: 900;
  }

  #actions {
    position: absolute;
    left: 10px;
    right: 10px;
    bottom: 16px;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
  }

  button {
    min-height: 76px;
    border: 3px solid #2b2927;
    border-radius: 20px;
    background: #fff;
    font: inherit;
    font-weight: 900;
    font-size: 16px;
    box-shadow: 0 6px 0 rgba(43,41,39,.15);
  }

  button:active {
    transform: translateY(3px);
    box-shadow: 0 3px 0 rgba(43,41,39,.15);
  }

  #message {
    position: absolute;
    left: 50%;
    top: 156px;
    transform: translateX(-50%);
    background: rgba(43,41,39,.94);
    color: white;
    padding: 8px 14px;
    border-radius: 999px;
    font-weight: 800;
    opacity: 0;
    transition: opacity .15s;
    pointer-events: none;
    z-index: 10;
    white-space: nowrap;
  }

  #message.show {
    opacity: 1;
  }
</style>
</head>

<body>

<div id="game">

  <div class="top">

    <div id="backpackPanel" class="panel">

      <div id="bagHeader">
        🎒 <span id="bagText">0 / 8</span>
      </div>

      <div id="bagContents"></div>

    </div>

    <div class="panel">
      🪙 <span id="coins">0</span>
    </div>

  </div>

  <div id="order">

    ORDER

    <div id="orderTarget">
      🟣 Purple ×1
    </div>

    <div style="font-size:13px;font-weight:700;">
      Reward: 🪙 <span id="reward">10</span>
    </div>

  </div>

  <div id="message"></div>

  <div id="field">

    <div
      class="source"
      id="red"
      data-color="red"
    >
      🔴
      <small>Hold</small>
      <div class="ring"></div>
    </div>

    <div
      class="source"
      id="blue"
      data-color="blue"
    >
      🔵
      <small>Hold</small>
      <div class="ring"></div>
    </div>

    <div
      class="source"
      id="yellow"
      data-color="yellow"
    >
      🟡
      <small>Hold</small>
      <div class="ring"></div>
    </div>

  </div>

  <div id="crafted"></div>

  <div id="actions">

    <button id="mixBtn">
      🎨 MIX
    </button>

    <button id="sellBtn">
      🪙 SELL RAW
    </button>

    <button id="fulfillBtn">
      📦 FULFILL
    </button>

  </div>

</div>

<script>

(() => {

  const capacity = 8;

  let coins = 0;
  let bag = [];
  let crafted = [];
  let activeSource = null;
  let gatherTimer = null;

  const colorInfo = {

    red: {
      emoji: "🔴",
      label: "Red"
    },

    blue: {
      emoji: "🔵",
      label: "Blue"
    },

    yellow: {
      emoji: "🟡",
      label: "Yellow"
    },

    purple: {
      emoji: "🟣",
      label: "Purple"
    },

    orange: {
      emoji: "🟠",
      label: "Orange"
    },

    green: {
      emoji: "🟢",
      label: "Green"
    }

  };


  const recipes = [

    {
      a: "red",
      b: "blue",
      result: "purple"
    },

    {
      a: "red",
      b: "yellow",
      result: "orange"
    },

    {
      a: "blue",
      b: "yellow",
      result: "green"
    }

  ];


  const orders = [

    {
      color: "purple",
      reward: 10
    },

    {
      color: "orange",
      reward: 12
    },

    {
      color: "green",
      reward: 12
    }

  ];


  let currentOrder = orders[0];


  const bagText =
    document.querySelector("#bagText");

  const bagContents =
    document.querySelector("#bagContents");

  const coinsEl =
    document.querySelector("#coins");

  const craftedEl =
    document.querySelector("#crafted");

  const orderTarget =
    document.querySelector("#orderTarget");

  const rewardEl =
    document.querySelector("#reward");

  const message =
    document.querySelector("#message");

  const mixBtn =
    document.querySelector("#mixBtn");

  const sellBtn =
    document.querySelector("#sellBtn");

  const fulfillBtn =
    document.querySelector("#fulfillBtn");


  function say(text) {

    message.textContent = text;

    message.classList.add("show");

    clearTimeout(message._timer);

    message._timer =
      setTimeout(() => {

        message.classList.remove("show");

      }, 950);

  }


  function countInBag(color) {

    return bag.filter(
      item => item === color
    ).length;

  }


  function countCrafted(color) {

    return crafted.filter(
      item => item === color
    ).length;

  }


  function renderBackpack() {

    bagContents.innerHTML = "";


    [
      "red",
      "blue",
      "yellow"
    ].forEach(color => {

      const count =
        countInBag(color);


      if (count > 0) {

        const chip =
          document.createElement("div");

        chip.className =
          "bagChip";

        chip.textContent =
          `${colorInfo[color].emoji} ${count}`;

        bagContents.appendChild(chip);

      }

    });


    if (bag.length === 0) {

      const empty =
        document.createElement("div");

      empty.style.fontSize =
        "13px";

      empty.style.opacity =
        ".6";

      empty.textContent =
        "Empty";

      bagContents.appendChild(empty);

    }

  }


  function renderCrafted() {

    craftedEl.innerHTML = "";


    [
      "purple",
      "orange",
      "green"
    ].forEach(color => {

      const count =
        countCrafted(color);


      if (count > 0) {

        const chip =
          document.createElement("div");

        chip.className =
          "craftedChip";

        chip.textContent =
          `${colorInfo[color].emoji} ${colorInfo[color].label} ×${count}`;

        craftedEl.appendChild(chip);

      }

    });

  }


  function updateHUD() {

    bagText.textContent =
      `${bag.length} / ${capacity}`;

    coinsEl.textContent =
      coins;


    const orderInfo =
      colorInfo[currentOrder.color];


    orderTarget.textContent =
      `${orderInfo.emoji} ${orderInfo.label} ×1`;


    rewardEl.textContent =
      currentOrder.reward;


    renderBackpack();

    renderCrafted();

  }


  function gatherOne(source) {

    if (bag.length >= capacity) {

      stopGather();

      say("🎒 Backpack full!");

      return;

    }


    bag.push(
      source.dataset.color
    );


    updateHUD();


    if (navigator.vibrate) {

      navigator.vibrate(16);

    }

  }


  function startGather(source) {

    stopGather();


    activeSource =
      source;


    source.classList.add(
      "active"
    );


    gatherOne(source);


    gatherTimer =
      setInterval(() => {

        gatherOne(source);

      }, 420);

  }


  function stopGather() {

    if (gatherTimer) {

      clearInterval(
        gatherTimer
      );

    }


    gatherTimer = null;


    if (activeSource) {

      activeSource.classList.remove(
        "active"
      );

    }


    activeSource = null;

  }


  function removeOneFromBag(color) {

    const index =
      bag.indexOf(color);


    if (index === -1) {

      return false;

    }


    bag.splice(
      index,
      1
    );


    return true;

  }


  function getAvailableRecipe() {

    return recipes.find(
      recipe => {

        return (
          countInBag(recipe.a) > 0 &&
          countInBag(recipe.b) > 0
        );

      }
    );

  }


  document
    .querySelectorAll(".source")
    .forEach(source => {

      source.addEventListener(
        "pointerdown",
        event => {

          event.preventDefault();


          source.setPointerCapture?.(
            event.pointerId
          );


          startGather(source);

        }
      );


      source.addEventListener(
        "pointerup",
        stopGather
      );


      source.addEventListener(
        "pointercancel",
        stopGather
      );


      source.addEventListener(
        "lostpointercapture",
        stopGather
      );

    });


  mixBtn.addEventListener(
    "click",
    () => {

      const recipe =
        getAvailableRecipe();


      if (!recipe) {

        say(
          "Need two mixable colors"
        );

        return;

      }


      removeOneFromBag(
        recipe.a
      );


      removeOneFromBag(
        recipe.b
      );


      crafted.push(
        recipe.result
      );


      const resultInfo =
        colorInfo[recipe.result];


      say(
        `${resultInfo.emoji} Made ${resultInfo.label}!`
      );


      updateHUD();


      if (navigator.vibrate) {

        navigator.vibrate(28);

      }

    }
  );


  sellBtn.addEventListener(
    "click",
    () => {

      if (bag.length === 0) {

        say(
          "No raw colors to sell"
        );

        return;

      }


      const earned =
        bag.length;


      coins +=
        earned;


      bag = [];


      say(
        `🪙 Sold raw colors +${earned}`
      );


      updateHUD();


      if (navigator.vibrate) {

        navigator.vibrate(24);

      }

    }
  );


  fulfillBtn.addEventListener(
    "click",
    () => {

      const neededColor =
        currentOrder.color;


      const craftedIndex =
        crafted.indexOf(
          neededColor
        );


      if (craftedIndex === -1) {

        const info =
          colorInfo[neededColor];


        say(
          `Need ${info.emoji} ${info.label}`
        );


        return;

      }


      const earned =
        currentOrder.reward;


      crafted.splice(
        craftedIndex,
        1
      );


      coins +=
        earned;


      let nextOrder;


      do {

        nextOrder =
          orders[
            Math.floor(
              Math.random() *
              orders.length
            )
          ];

      } while (

        orders.length > 1 &&

        nextOrder.color ===
        currentOrder.color

      );


      currentOrder =
        nextOrder;


      say(
        `✅ Order complete! +${earned}`
      );


      updateHUD();


      if (navigator.vibrate) {

        navigator.vibrate(
          [25, 20, 25]
        );

      }

    }
  );


  window.addEventListener(
    "pointerup",
    stopGather
  );


  window.addEventListener(
    "pointercancel",
    stopGather
  );


  updateHUD();

})();

</script>

</body>
</html>
